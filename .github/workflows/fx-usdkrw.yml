# 원/달러 일별 환율 자동 수집(하루 1회, 한국 07:23 화~토). 앱·GAS 코드는 건드리지 않고 data/fx/usdkrw.json 만 갱신한다.
# 비밀값·API 키 없음. 실패하면 아무것도 커밋하지 않는다(재시도·우회 없음, 마지막 성공 파일 유지).
name: fx-usdkrw
on:
  schedule:
    - cron: '23 22 * * 1-5'   # UTC 22:23 월~금 = 한국 07:23 화~토(미국 장 마감 뒤)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fx-usdkrw
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: fetch USD/KRW
        run: node tools/fetch-usdkrw.cjs
      - name: commit data only
        run: |
          git config user.name "has-fx-bot"
          git config user.email "has-fx-bot@users.noreply.github.com"
          git add data/fx
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data(fx): 원/달러 환율 자동 수집 $(date -u +%Y-%m-%d)" && git push; fi
