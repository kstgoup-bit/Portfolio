<main class="shell"><aside class="notice"><strong>붙여 넣은 글은 이 화면 밖으로 나가지 않습니다.</strong><p>결과는 패턴으로 찾은 것이라 완전하지 않을 수 있습니다. 공유 전에 반드시 직접 한 번 더 확인하세요. 연결식·템플릿 표현식 등 비밀값의 경계가 불확실하면 결과를 내보내지 않습니다. 새로고침하면 입력과 결과가 사라집니다.</p></aside>
