<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>HAS 원본 사본 내보내기</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; background: #f4f6fa; color: #1a1a1a; font: 16px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p, li { font-size: 15px; color: #222; }
  .warn { background: #fff4e5; border: 1px solid #b26a00; color: #333; border-radius: 8px; padding: 10px 12px; }
  button { width: 100%; min-height: 48px; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; background: #1f4e9a; color: #fff; margin-top: 12px; }
  button:disabled { background: #555; }
  #status { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-top: 12px; overflow-wrap: anywhere; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>HAS 원본 사본 내보내기</h1>
  <p>이 화면은 폰에 저장된 앱 자료를 <b>읽기만</b> 해서 파일 하나로 내려받습니다. 자료를 바꾸거나 지우지 않고, 인터넷으로 보내지 않습니다.</p>
  <div class="warn">API 키·비밀번호(Alpha Vantage, Gemini, 앱 비밀번호)는 파일에서 뺍니다. GAS 주소는 포함되니 파일을 다른 사람에게 보내지 마세요.</div>
  <ul id="summary"></ul>
  <button id="exportBtn" type="button">원본 사본 내려받기</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var EXCLUDED = ['v5_alphaVantageKey', 'v5_geminiKey', 'v5_pw'];
  var ACCOUNTS = [['v5_gen', '일반'], ['v5_dom', 'ISA(국내)'], ['v5_ov', '해외'], ['v5_pen', '연금']];
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('exportBtn');

  function readAll() {
    var out = {}, keys = [];
    for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    keys.sort();
    keys.forEach(function (k) {
      if (k === null || EXCLUDED.indexOf(k) >= 0) return;
      out[k] = localStorage.getItem(k); // raw string, unparsed and unchanged
    });
    return out;
  }
  function count(raw) {
    try { var v = JSON.parse(raw); return Array.isArray(v) ? v.length + '종목' : '형식 확인 필요'; } catch (e) { return '형식 확인 필요'; }
  }
  function render() {
    var items;
    try { items = readAll(); } catch (e) { statusEl.textContent = '저장소를 읽을 수 없습니다. 앱과 같은 주소에서 열었는지 확인하세요.'; btn.disabled = true; return null; }
    var ul = document.getElementById('summary');
    ul.textContent = '';
    ACCOUNTS.forEach(function (a) {
      var li = document.createElement('li');
      li.textContent = a[1] + ' 계좌: ' + (Object.prototype.hasOwnProperty.call(items, a[0]) ? count(items[a[0]]) : '없음');
      ul.appendChild(li);
    });
    var li = document.createElement('li');
    li.textContent = '저장 항목 ' + Object.keys(items).length + '개 (키·비밀번호 ' + EXCLUDED.length + '종 제외)';
    ul.appendChild(li);
    return items;
  }
  function sha256Hex(text) {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  btn.addEventListener('click', function () {
    var items = render();
    if (!items) return;
    var body = JSON.stringify(items);
    sha256Hex(body).then(function (hash) {
      var file = { format: 'has-raw-localstorage-v1', exportedAt: new Date().toISOString(), origin: location.origin, excludedKeys: EXCLUDED.slice(), itemCount: Object.keys(items).length, itemsSha256: hash, items: items };
      var blob = new Blob([JSON.stringify(file, null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'HAS_raw_backup_' + file.exportedAt.slice(0, 10) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 30000);
      statusEl.textContent = '✅ 내려받기를 시작했습니다. 카카오톡 나에게 보내기 등으로 보관하세요. 항목 ' + file.itemCount + '개' + (hash ? ' · 확인값 ' + hash.slice(0, 12) : '');
    });
  });
  render();
})();
</script>
</body>
</html>
