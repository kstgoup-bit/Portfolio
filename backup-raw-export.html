<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>HAS 원본 사본 도구</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; background: #f4f6fa; color: #1a1a1a; font: 16px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 17px; margin: 20px 0 6px; }
  p, li { font-size: 15px; color: #222; }
  .warn { background: #fff4e5; border: 1px solid #b26a00; color: #333; border-radius: 8px; padding: 10px 12px; }
  button, label.file { display: block; box-sizing: border-box; width: 100%; min-height: 48px; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; background: #1f4e9a; color: #fff; margin-top: 12px; text-align: center; line-height: 48px; }
  button:disabled { background: #555; }
  label.file { background: #1b5e20; }
  input[type=file] { position: absolute; left: -9999px; }
  .status { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-top: 12px; overflow-wrap: anywhere; white-space: pre-line; }
  .bad { color: #8b0000; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1 id="toolTitle">HAS 원본 사본 도구</h1>
  <p>폰에 저장된 HAS 자료를 <b>읽기만</b> 해서 파일로 내려받습니다. 자료를 바꾸거나 지우지 않고, 인터넷으로 보내지 않습니다. <b>인터넷이 연결된 상태</b>에서 여세요. 이 제목 대신 평소 앱 화면이 뜨면 사용을 멈추세요.</p>
  <div class="warn">HAS 자료(<code>v5_</code>, 계산기)만 담습니다. API 키·앱 비밀번호·GAS 주소는 담지 않습니다. 같은 주소의 다른 앱 자료도 담지 않습니다.</div>

  <h2>1. 내려받기</h2>
  <ul id="summary"></ul>
  <button id="exportBtn" type="button">원본 사본 내려받기</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <h2>2. 받은 파일 확인</h2>
  <p>내려받은 파일을 다시 열어 손상 없이 저장됐는지 확인합니다. 지금 폰 자료와도 비교합니다.</p>
  <label class="file" for="verifyFile">받은 파일 열어 확인</label>
  <input id="verifyFile" type="file" accept="application/json,.json">
  <div id="verifyStatus" class="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var FORMAT = 'has-raw-localstorage-v2';
  var EXCLUDED = ['v5_alphaVantageKey', 'v5_geminiKey', 'v5_pw', 'v5_gas'];
  var ACCOUNTS = [['v5_gen', '일반'], ['v5_dom', 'ISA(국내)'], ['v5_ov', '해외'], ['v5_pen', '연금']];
  function allowed(k) {
    return typeof k === 'string' && EXCLUDED.indexOf(k) < 0 && (/^v5_[A-Za-z0-9_]{1,60}$/.test(k) || /^calc_[pq][A-Za-z0-9_]{0,60}$/.test(k));
  }
  function $(id) { return document.getElementById(id); }

  // Returns [[key, rawString], ...] sorted by key. Throws on read inconsistency.
  function snapshot() {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (allowed(k)) keys.push(k); }
    keys.sort();
    return keys.map(function (k) {
      var v = localStorage.getItem(k);
      if (v === null) throw new Error('read-changed');
      return [k, v];
    });
  }
  function samePairs(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i][0] !== b[i][0] || a[i][1] !== b[i][1]) return false;
    return true;
  }
  function accountReport(pairs) {
    var map = new Map(pairs), rows = [], problems = [];
    ACCOUNTS.forEach(function (a) {
      if (!map.has(a[0])) { rows.push(a[1] + ' 계좌: 저장값 없음'); problems.push(a[1] + ' 계좌 저장값 없음'); return; }
      var n = null;
      try { var v = JSON.parse(map.get(a[0])); if (Array.isArray(v)) n = v.length; } catch (e) {}
      if (n === null) { rows.push(a[1] + ' 계좌: 형식 확인 불가'); problems.push(a[1] + ' 계좌 형식 확인 불가'); }
      else rows.push(a[1] + ' 계좌: ' + n + '종목');
    });
    return { rows: rows, problems: problems };
  }
  function sha256Hex(text) {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error('no-hash'));
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function showSummary(pairs) {
    var ul = $('summary'); ul.textContent = '';
    var rep = accountReport(pairs);
    rep.rows.concat(['HAS 저장 항목 ' + pairs.length + '개']).forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    return rep;
  }
  function fail(el, msg) { el.textContent = msg; el.className = 'status bad'; }

  var first;
  try { first = snapshot(); } catch (e) { first = null; }
  if (!first) { fail($('status'), '저장소를 읽을 수 없습니다. 내려받기를 중단합니다.'); $('exportBtn').disabled = true; }
  else {
    var rep0 = showSummary(first);
    if (rep0.problems.length) { fail($('status'), '내려받기 중단: ' + rep0.problems.join(', ') + '\n평소 앱과 같은 주소·같은 브라우저에서 열었는지 확인하세요.'); $('exportBtn').disabled = true; }
  }

  $('exportBtn').addEventListener('click', function () {
    var st = $('status'); st.className = 'status';
    var a1, a2;
    try { a1 = snapshot(); a2 = snapshot(); } catch (e) { return fail(st, '읽는 중 자료가 바뀌었습니다. 다른 탭의 앱을 닫고 다시 시도하세요.'); }
    if (!samePairs(a1, a2) || !samePairs(a1, first)) return fail(st, '화면을 연 뒤 자료가 바뀌었습니다. 다른 탭의 앱을 닫고 이 화면을 새로 연 뒤 다시 시도하세요.');
    var rep = accountReport(a1);
    if (rep.problems.length) return fail(st, '내려받기 중단: ' + rep.problems.join(', '));
    var body = JSON.stringify(a1);
    sha256Hex(body).then(function (hash) {
      var file = { format: FORMAT, exportedAt: new Date().toISOString(), origin: location.origin, path: location.pathname, excludedKeys: EXCLUDED.slice(), itemCount: a1.length, accounts: rep.rows, pairsSha256: hash, pairs: a1 };
      var blob = new Blob([JSON.stringify(file, null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'HAS_raw_backup_' + file.exportedAt.slice(0, 10) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 30000);
      st.textContent = '✅ 내려받기 시작. 항목 ' + file.itemCount + '개 · 확인값 ' + hash.slice(0, 12) + '\n이제 아래 "받은 파일 열어 확인"으로 저장된 파일을 확인하세요.';
    }, function () { fail(st, '이 브라우저에서 확인값을 만들 수 없어 중단합니다.'); });
  });

  $('verifyFile').addEventListener('change', function (ev) {
    var vs = $('verifyStatus'); vs.className = 'status'; vs.textContent = '확인 중…';
    var f = ev.target.files && ev.target.files[0];
    if (!f) return fail(vs, '파일이 선택되지 않았습니다.');
    if (f.size > 20 * 1024 * 1024) return fail(vs, '파일이 너무 큽니다.');
    f.text().then(function (txt) {
      var file;
      try { file = JSON.parse(txt); } catch (e) { return fail(vs, '❌ 파일을 읽을 수 없습니다(손상 또는 다른 파일).'); }
      if (!file || file.format !== FORMAT || !Array.isArray(file.pairs) || !file.pairs.every(function (p) { return Array.isArray(p) && p.length === 2 && allowed(p[0]) && typeof p[1] === 'string'; }))
        return fail(vs, '❌ HAS 원본 사본 파일이 아닙니다.');
      return sha256Hex(JSON.stringify(file.pairs)).then(function (hash) {
        if (hash !== file.pairsSha256) return fail(vs, '❌ 확인값 불일치: 파일이 손상됐습니다. 다시 내려받으세요.');
        var rep = accountReport(file.pairs);
        if (rep.problems.length) return fail(vs, '❌ ' + rep.problems.join(', '));
        var now; try { now = snapshot(); } catch (e) { now = null; }
        var same = now && samePairs(now, file.pairs);
        vs.textContent = '✅ 파일 정상 · 확인값 ' + hash.slice(0, 12) + '\n' + rep.rows.join('\n') + '\n지금 폰 자료와 ' + (same ? '완전히 같습니다.' : '다릅니다(내려받은 뒤 앱을 사용했다면 정상).');
      });
    }, function () { fail(vs, '❌ 파일을 열 수 없습니다.'); });
  });
})();
</script>
</body>
</html>
